# VM / UAT / production stack: nginx (TLS, the only public entry point)
# + oauth2-proxy (Microsoft Entra ID sign-in) + backend + frontend.
#
#   docker compose --env-file deploy/vm/vm.env.local -f deploy/vm/docker-compose.yml up -d --build
#
# Differences from the repo-root docker-compose.yml (the local convenience
# stack, which uses the dev-login form):
# - Dev login is OFF. Identity comes only from oauth2-proxy, via headers the
#   backend trusts only from nginx's fixed internal address.
# - The backend publishes no port: only nginx can reach it.
# - Paths are relative to this file (deploy/vm/), and the project and data
#   volume names are fixed by vm.env.local, so the SQLite database survives
#   rebuilds and can reuse the volume an earlier stack created.
# - A `backup` sidecar snapshots that database daily into BACKUP_HOST_DIR on
#   the VM; `db-restore` (run on demand) restores one. Every service's
#   container log is size-capped.
#
# Setup steps, including the Entra ID app registration and backups:
# deploy/vm/README.md.

name: ${COMPOSE_PROJECT_NAME:-jira2pullreq}

# Docker's default json-file log grows without limit; cap each container at
# DOCKER_LOG_MAX_FILE files of DOCKER_LOG_MAX_SIZE (50 MB with the defaults).
x-logging: &logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: "${DOCKER_LOG_MAX_FILE:-5}"

# The backup and restore containers: the stdlib-only script on the base
# image the backend is already built from, no network, no capabilities, a
# read-only root filesystem. They run as uid 1000, the backend image's
# appuser, which owns the database (a restored file must stay writable by it).
x-db-tool: &db-tool
  image: python:3.12-slim
  user: "1000:1000"
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: jira2pullreq-backend:local
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${BACKEND_ENV_FILE:-../../backend/.env}
    environment:
      # Forced here, so a stray value in backend/.env can't re-enable dev login.
      AUTH_ENABLED: "true"
      AUTH_ALLOW_DEV_LOGIN: "false"
      AUTH_SESSION_COOKIE_SECURE: "true"
      AUTH_TRUSTED_PROXY_ENABLED: "true"
      # Only nginx's fixed address may assert who the user is.
      AUTH_TRUSTED_PROXY_SOURCES: '["${APP_SUBNET_PREFIX:-172.30.0}.10/32"]'
      CORS_ORIGINS: '["https://${APP_HOSTNAME:?set APP_HOSTNAME in vm.env.local}"]'
      # Sign out = clear the app session, then oauth2-proxy's cookie, then
      # Microsoft's own session, landing on the app's signed-out page (which
      # must be registered in the Entra app as a Web redirect URI).
      AUTH_SSO_PROVIDER_LABEL: Microsoft
      AUTH_SSO_IDP_LOGOUT_URL: https://login.microsoftonline.com/${ENTRA_TENANT_ID:?set ENTRA_TENANT_ID in vm.env.local}/oauth2/v2.0/logout
      AUTH_SSO_POST_LOGOUT_REDIRECT_URL: https://${APP_HOSTNAME}/signin/signed-out
      # Validation runs the target repo's own code (npm scripts, tests). Until
      # it runs in a sandbox, it stays off on this shared stack: every job's
      # validation is reported as skipped. docs/validation-isolation-proposal.md
      VALIDATION_ENABLED: "false"
    # No "ports:" on purpose — the backend is reachable only through nginx.
    volumes:
      - backend_var:/app/var
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      app_net:
        ipv4_address: ${APP_SUBNET_PREFIX:-172.30.0}.20

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: jira2pullreq-frontend:local
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      # NEXT_PUBLIC_API_BASE_URL stays unset: the browser calls /api/ on the
      # same origin, through nginx.
      # Shown on the public sign-in pages ("Sign in with Microsoft").
      SSO_PROVIDER_LABEL: Microsoft
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: ${APP_SUBNET_PREFIX:-172.30.0}.30

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${OAUTH2_PROXY_ENV_FILE:-../oauth2-proxy/azure-entra.env.local}
    environment:
      OAUTH2_PROXY_REDIRECT_URL: https://${APP_HOSTNAME}/oauth2/callback
      # Microsoft shows its account picker on every sign-in, so a shared
      # browser never silently signs in as whoever used it last.
      OAUTH2_PROXY_PROMPT: select_account
      # Lets sign-out continue to Microsoft's logout page (oauth2-proxy only
      # redirects to whitelisted domains).
      OAUTH2_PROXY_WHITELIST_DOMAINS: login.microsoftonline.com
    networks:
      app_net:
        ipv4_address: ${APP_SUBNET_PREFIX:-172.30.0}.40

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - backend
      - frontend
      - oauth2-proxy
    ports:
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    environment:
      # Substituted into nginx.conf.template by the official image at startup.
      APP_HOSTNAME: ${APP_HOSTNAME}
      TLS_CERT_FILE: ${TLS_CERT_FILE:?set TLS_CERT_FILE in vm.env.local}
      TLS_KEY_FILE: ${TLS_KEY_FILE:?set TLS_KEY_FILE in vm.env.local}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_DIR:-../../certs}:/etc/nginx/certs:ro
    networks:
      app_net:
        ipv4_address: ${APP_SUBNET_PREFIX:-172.30.0}.10

  backup:
    <<: *db-tool
    restart: unless-stopped
    # Online backup API + PRAGMA integrity_check, keeping the newest
    # BACKUP_KEEP. The data volume is mounted read-only: the sidecar can't
    # change the database. The Fernet keys are NOT in these snapshots (they
    # live in backend/.env) and must be backed up somewhere else.
    command: ["python", "/opt/backup/sqlite_backup.py", "run"]
    environment:
      BACKUP_SOURCE: /data/jobs.db
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - backend_var:/data:ro
      - ./backup/sqlite_backup.py:/opt/backup/sqlite_backup.py:ro
      - ${BACKUP_HOST_DIR:-/var/backups/jira2pullreq}:/backups
    depends_on:
      backend:
        condition: service_healthy
    # Unhealthy once the newest snapshot is more than an hour overdue.
    healthcheck:
      test: ["CMD", "python", "/opt/backup/sqlite_backup.py", "health"]
      interval: 5m
      timeout: 30s
      retries: 1
      start_period: 5m

  # Not started by `up`. Restore (backend and backup stopped first):
  #   docker compose ... run --rm db-restore restore /backups/<snapshot>.db
  # Without arguments it lists the snapshots. deploy/vm/README.md, "Backups".
  db-restore:
    <<: *db-tool
    profiles: ["restore"]
    restart: "no"
    entrypoint: ["python", "/opt/backup/sqlite_backup.py"]
    command: ["list"]
    environment:
      BACKUP_SOURCE: /data/jobs.db
      BACKUP_DIR: /backups
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - backend_var:/data
      - ./backup/sqlite_backup.py:/opt/backup/sqlite_backup.py:ro
      - ${BACKUP_HOST_DIR:-/var/backups/jira2pullreq}:/backups:ro

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${APP_SUBNET_PREFIX:-172.30.0}.0/24

volumes:
  backend_var:
    # Set to an existing volume's name (docker volume ls) to keep its data.
    name: ${BACKEND_VAR_VOLUME:-jira2pullreq_backend_var}
