[project]
name = "jira2pullreq-backend"
version = "0.1.0"
description = "Backend for jira2pullreq Milestone 1: ticket -> plan"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "cryptography>=49.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.12.5",
    "claude-agent-sdk>=0.2.115",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"
# FastAPI registers routes/handlers via decorators; the names are never read again.
reportUnusedFunction = "none"

[[tool.pyright.executionEnvironments]]
# starlette's TestClient is effectively untyped; don't fight it in tests.
root = "tests"
extraPaths = ["."]
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUntypedFunctionDecorator = "none"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
